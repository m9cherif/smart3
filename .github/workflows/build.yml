name: Flutter builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  # Not a dependency of `build`: every job starts at the same time.
  build:
    name: ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            build_command: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: smart3-android-arm64
          - os: ubuntu-latest
            target: linux
            build_command: flutter build linux --release
            artifact_path: build/linux/x64/release/bundle
            artifact_name: smart3-linux-x64
          - os: windows-latest
            target: windows
            build_command: flutter build windows --release
            artifact_path: build/windows/x64/runner/Release
            artifact_name: smart3-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Warm ~/.gradle (wrapper distribution + resolved dependencies) across runs
      # instead of re-downloading Gradle 8.14 and the AGP/Kotlin classpath.
      - name: Set up Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v5

      # Content-hash build cache: unchanged tasks are restored from
      # ~/.gradle/caches/build-cache-1 on the next run.
      - name: Enable Gradle build cache
        if: matrix.target == 'android'
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.caching=true\n' >> "$HOME/.gradle/gradle.properties"

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libasound2-dev \
            libsqlite3-dev libjsoncpp-dev libnotify-dev libsecret-1-dev \
            libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build_command }}

      - name: Enforce Android size budget (< 40 MB)
        if: matrix.target == 'android'
        shell: bash
        run: |
          SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          echo "APK size: $SIZE bytes"
          test "$SIZE" -lt 41943040

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
