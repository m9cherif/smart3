# This machine has ~8 GB RAM; asking for an 8 GB heap makes the JVM die with a
# native out-of-memory during release builds.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
# Keep the Kotlin compiler in its own, bounded JVM.
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Release builds run on Windows where the Kotlin incremental caches in build/
# can be locked by the file watcher and fail to close; a release build never
# benefits from incremental Kotlin compilation anyway.
kotlin.incremental=false
